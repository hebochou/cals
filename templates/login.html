{% extends "base.html" %}
{% block title %}学生登录 - CALS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-hero">
            <div class="auth-icon">🎓</div>
            <h1 class="auth-title">欢迎回来</h1>
            <p class="auth-subtitle">开启你的自适应学习之旅</p>
        </div>

        <form action="{{ url_for("auth_bp.login") }}" method="post" class="auth-form">
            <div class="field">
                <label for="username">学号</label>
                <input type="text" name="username" id="username" required placeholder="请输入 11 位学号" pattern="\d{11}" title="学号必须为11位纯数字" minlength="11" maxlength="11" inputmode="numeric" class="input">
            </div>

            <div class="field">
                <label for="password">密码</label>
                <input type="password" name="password" id="password" required placeholder="••••••••" class="input">
            </div>

            <button type="submit" class="btn btn-primary">立即登录</button>

            <p class="form-hint">遇到问题？联系管理员</p>
        </form>
    </div>
</div>
{% endblock %}
